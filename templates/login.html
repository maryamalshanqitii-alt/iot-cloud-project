<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — IoT Monitoring</title>
  <style>
    :root{
      --bg:#0E1420; --panel:#151D2C; --panel2:#1C2537;
      --text:#E6EDF7; --muted:#8699B5; --accent:#38BDF8; --danger:#F87171;
    }
    *{box-sizing:border-box;}
    body{
      margin:0; min-height:100vh; background:var(--bg); color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      display:flex; align-items:center; justify-content:center; padding:24px;
    }
    .card{
      width:100%; max-width:400px; background:var(--panel);
      border:1px solid rgba(255,255,255,.08); border-radius:14px; padding:32px;
    }
    h1{margin:0 0 4px; font-size:22px; font-weight:500;}
    .brand{color:var(--accent);}
    p.sub{margin:0 0 24px; color:var(--muted); font-size:14px;}
    label{display:block; margin-bottom:6px; font-size:13px; color:var(--muted);
          text-transform:uppercase; letter-spacing:.06em;}
    input{
      width:100%; padding:12px 14px; margin-bottom:18px; border-radius:9px;
      border:1px solid rgba(255,255,255,.12); background:var(--panel2);
      color:var(--text); font-size:15px;
    }
    input:focus{outline:none; border-color:var(--accent);}
    button{
      width:100%; padding:13px; border:none; border-radius:9px;
      background:var(--accent); color:#06212F; font-size:15px; font-weight:500;
      cursor:pointer;
    }
    button:hover{filter:brightness(1.08);}
    .error{
      background:rgba(248,113,113,.12); border:1px solid rgba(248,113,113,.4);
      color:var(--danger); padding:11px 14px; border-radius:9px;
      font-size:14px; margin-bottom:18px;
    }
    footer{margin-top:22px; color:var(--muted); font-size:12px; text-align:center;}
  </style>
</head>
<body>
  <form class="card" method="post" action="/login">
    <h1>IoT <span class="brand">Monitoring</span></h1>
    <p class="sub">Sign in to view the environmental monitoring system.</p>

    {% if error %}<div class="error">{{ error }}</div>{% endif %}

    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username"
           autocapitalize="none" autofocus required>

    <label for="password">Password</label>
    <input id="password" name="password" type="password"
           autocomplete="current-password" required>

    <button type="submit">Sign in</button>

    <footer>CE6100 — Edge and Cloud Computing</footer>
  </form>
</body>
</html>
