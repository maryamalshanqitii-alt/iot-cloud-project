<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}IoT Monitoring{% endblock %}</title>
<style>
  :root{
    --bg:#0E1420; --panel:#161E2E; --panel2:#1E2838; --line:#2A3648;
    --text:#E8EDF5; --muted:#8696AE;
    --accent:#38BDF8; --ok:#34D399; --warn:#F97316; --danger:#EF4444;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    line-height:1.6;
  }
  header{
    background:var(--panel); border-bottom:1px solid var(--line);
    padding:0 24px; position:sticky; top:0; z-index:10;
  }
  .bar{max-width:1100px; margin:0 auto; display:flex; align-items:center;
       justify-content:space-between; flex-wrap:wrap; gap:12px; padding:14px 0;}
  .brand{font-size:17px; font-weight:600; letter-spacing:-.01em;}
  .brand span{color:var(--accent);}
  nav{display:flex; gap:4px; flex-wrap:wrap;}
  nav a{
    color:var(--muted); text-decoration:none; font-size:14px;
    padding:7px 14px; border-radius:8px; transition:.15s;
  }
  nav a:hover{color:var(--text); background:var(--panel2);}
  nav a.active{color:var(--accent); background:rgba(56,189,248,.12);}

  main{max-width:1100px; margin:0 auto; padding:28px 24px 60px;}
  h1{font-size:24px; font-weight:600; margin:0 0 4px; letter-spacing:-.015em;}
  .sub{color:var(--muted); font-size:14px; margin:0 0 26px;}

  .grid{display:grid; gap:16px; margin-bottom:24px;}
  .g4{grid-template-columns:repeat(auto-fit,minmax(210px,1fr));}
  .g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr));}

  .card{
    background:var(--panel); border:1px solid var(--line);
    border-radius:14px; padding:20px;
  }
  .card .label{font-size:12.5px; color:var(--muted); margin-bottom:8px;
               text-transform:uppercase; letter-spacing:.05em;}
  .card .value{font-size:30px; font-weight:600; letter-spacing:-.02em;
               font-variant-numeric:tabular-nums;}
  .card .value .unit{font-size:15px; color:var(--muted); font-weight:400; margin-left:3px;}
  .card .foot{font-size:12.5px; color:var(--muted); margin-top:6px;}

  .pill{
    display:inline-flex; align-items:center; gap:7px;
    padding:5px 13px; border-radius:999px; font-size:13px; font-weight:500;
  }
  .pill.ok{background:rgba(52,211,153,.13); color:var(--ok);}
  .pill.off{background:rgba(134,150,174,.13); color:var(--muted);}
  .pill.warn{background:rgba(249,115,22,.13); color:var(--warn);}
  .dot{width:7px; height:7px; border-radius:50%; background:currentColor;}

  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  th{
    text-align:left; padding:11px 12px; color:var(--muted);
    font-weight:500; font-size:12px; text-transform:uppercase;
    letter-spacing:.05em; border-bottom:1px solid var(--line);
  }
  td{padding:11px 12px; border-bottom:1px solid var(--line);
     font-variant-numeric:tabular-nums;}
  tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--panel2);}

  .tag{font-size:11.5px; padding:3px 9px; border-radius:6px; font-weight:500;}
  .tag.naive{background:rgba(134,150,174,.16); color:var(--muted);}
  .tag.smart{background:rgba(56,189,248,.14); color:var(--accent);}
  .tag.alert{background:rgba(239,68,68,.14); color:var(--danger);}

  .filters{display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap;}
  .filters a{
    font-size:13.5px; text-decoration:none; color:var(--muted);
    padding:7px 15px; border:1px solid var(--line);
    border-radius:8px; transition:.15s;
  }
  .filters a:hover{color:var(--text); border-color:var(--muted);}
  .filters a.on{background:var(--accent); color:#06283A; border-color:var(--accent); font-weight:500;}

  .empty{text-align:center; padding:50px 20px; color:var(--muted);}

  footer{
    max-width:1100px; margin:0 auto; padding:20px 24px 40px;
    color:var(--muted); font-size:12.5px; border-top:1px solid var(--line);
  }
  code{background:var(--panel2); padding:2px 7px; border-radius:5px; font-size:12.5px;}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand">IoT <span>Monitoring</span></div>
    <nav>
      <a href="/" class="{% block n1 %}{% endblock %}">Dashboard</a>
      <a href="/readings" class="{% block n2 %}{% endblock %}">Readings</a>
      <a href="/charts" class="{% block n3 %}{% endblock %}">Charts</a>
      <a href="/alerts" class="{% block n4 %}{% endblock %}">Alerts</a>
    </nav>
  </div>
</header>

<main>
{% block content %}{% endblock %}
</main>

<footer>
  CE6100 — Edge and Cloud Computing &nbsp;·&nbsp;
  Sensor → ESP32 (edge) → Load Balancer → EC2 (Auto Scaling) → PostgreSQL
  {% if server %}&nbsp;·&nbsp; Served by <code>{{ server }}</code>{% endif %}
</footer>
</body>
</html>
